function EspaceAdmin({ session, onDeconnexion, onRetour }) {
  const [onglet, setOnglet] = useState("tableau");
  const [vue, setVue] = useState({ ecran: "liste" });

  if (vue.ecran === "editeur") return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <EditeurExamen session={session} examenId={vue.examenId} labelRetour="← Retour à l'espace administrateur"
        onRetour={() => setVue({ ecran: "liste" })}
        onDuplique={nouvelId => setVue({ ecran: "editeur", examenId: nouvelId })} />
    </>
  );
  if (vue.ecran === "resultats") return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <ResultatsExamen session={session} examen={vue.examen} onRetour={() => setVue({ ecran: "liste" })} />
    </>
  );

  return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <div className="container-wide">
        <button className="linkbtn" style={{ marginBottom: 10 }} onClick={onRetour}>← Retour à mon espace enseignant</button>
        <h2 style={{ marginBottom: 4 }}>🛡️ Espace administrateur</h2>
        <p style={{ fontSize: ".85rem", color: "var(--ink-faint)", marginBottom: 18 }}>
          Supervision de l'ensemble des classes, enseignants et devoirs du {NOM_ETABLISSEMENT}.
        </p>

        <div className="tabs">
          <button className={"tab" + (onglet === "tableau" ? " active" : "")} onClick={() => setOnglet("tableau")}>Tableau de bord</button>
          <button className={"tab" + (onglet === "devoirs" ? " active" : "")} onClick={() => setOnglet("devoirs")}>Devoirs & planifications</button>
          <button className={"tab" + (onglet === "eleves" ? " active" : "")} onClick={() => setOnglet("eleves")}>Élèves & classes</button>
          <button className={"tab" + (onglet === "enseignants" ? " active" : "")} onClick={() => setOnglet("enseignants")}>Enseignants</button>
        </div>

        {onglet === "tableau" && <AdminTableauDeBord session={session} onVoirDevoirs={() => setOnglet("devoirs")} />}
        {onglet === "devoirs" && (
          <AdminDevoirs session={session}
            onOuvrirEditeur={id => setVue({ ecran: "editeur", examenId: id })}
            onOuvrirResultats={ex => setVue({ ecran: "resultats", examen: ex })} />
        )}
        {onglet === "eleves" && <AdminEleves session={session} />}
        {onglet === "enseignants" && <AdminEnseignants session={session} />}
      </div>
    </>
  );
}

function AdminTableauDeBord({ session, onVoirDevoirs }) {
  const [stats, setStats] = useState(null);
  const [examens, setExamens] = useState(null);
  const [erreur, setErreur] = useState("");
  const [maj, setMaj] = useState(new Date());

  async function charger() {
    try {
      const [s, e] = await Promise.all([
        rpc("rpc_admin_stats_globales", { p_token: session.token }),
        rpc("rpc_admin_tous_examens", { p_token: session.token }),
      ]);
      setStats(s.stats);
      setExamens(e.examens);
      setErreur("");
      setMaj(new Date());
    } catch (err) { setErreur(err.message); }
  }
  useEffect(() => {
    charger();
    const id = setInterval(charger, 20000);
    return () => clearInterval(id);
  }, []);

  if (erreur) return <div className="error-msg">{erreur} <button className="linkbtn" onClick={charger}>Réessayer</button></div>;
  if (!stats) return <p>Chargement…</p>;

  const maintenant = new Date();
  const enCoursMaintenant = (examens || []).filter(ex => ex.statut === "publie" &&
    (!ex.date_ouverture || new Date(ex.date_ouverture) <= maintenant) &&
    (!ex.date_fermeture || new Date(ex.date_fermeture) >= maintenant));

  const cartes = [
    { label: "Élèves autorisés", valeur: stats.nb_eleves_autorises, couleur: "var(--ink)" },
    { label: "Comptes élèves créés", valeur: stats.nb_comptes_eleves_crees, couleur: "var(--ink)" },
    { label: "Enseignants", valeur: stats.nb_enseignants, couleur: "var(--ink)" },
    { label: "Devoirs publiés", valeur: stats.nb_examens_publies, couleur: "var(--success)" },
    { label: "Brouillons", valeur: stats.nb_examens_brouillon, couleur: "var(--ink-faint)" },
    { label: "Compositions en cours", valeur: stats.nb_compositions_en_cours, couleur: "var(--accent)" },
    { label: "Terminées (24h)", valeur: stats.nb_compositions_terminees_24h, couleur: "var(--success)" },
  ];

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 22 }}>
        {cartes.map(c => (
          <div className="card" key={c.label} style={{ textAlign: "center", padding: "16px 10px" }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "1.7rem", fontWeight: 700, color: c.couleur }}>{c.valeur}</div>
            <div style={{ fontSize: ".76rem", color: "var(--ink-faint)", marginTop: 2 }}>{c.label}</div>
          </div>
        ))}
      </div>

      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, flexWrap: "wrap", gap: 8 }}>
          <h3 style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 0 }}>
            {enCoursMaintenant.length > 0 && (
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: "var(--accent)", display: "inline-block", animation: "pulse 1.4s infinite" }}></span>
            )}
            En ce moment
          </h3>
          <span style={{ fontSize: ".75rem", color: "var(--ink-faint)" }}>Actualisé à {maj.toLocaleTimeString()}</span>
        </div>
        {enCoursMaintenant.length === 0 ? (
          <p className="info-msg">Aucun devoir ouvert aux élèves à l'instant.</p>
        ) : enCoursMaintenant.map(ex => (
          <div className="list-row" key={ex.id}>
            <div>
              <strong>{ex.titre}</strong>
              <div style={{ fontSize: ".78rem", color: "var(--ink-faint)" }}>
                {ex.enseignant_prenom} {ex.enseignant_nom} · {ex.classes_cibles && ex.classes_cibles.length ? ex.classes_cibles.join(", ") : "toutes classes"}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <span className="note-badge note-ok">{ex.nb_compositions_en_cours} en cours</span>
              <div style={{ fontSize: ".75rem", color: "var(--ink-faint)", marginTop: 3 }}>{ex.nb_compositions_terminees} terminée(s)</div>
            </div>
          </div>
        ))}
        <button className="linkbtn" style={{ marginTop: 6 }} onClick={onVoirDevoirs}>Voir tous les devoirs →</button>
      </div>
    </div>
  );
}

function AdminDevoirs({ session, onOuvrirEditeur, onOuvrirResultats }) {
  const [examens, setExamens] = useState(null);
  const [erreur, setErreur] = useState("");
  const [recherche, setRecherche] = useState("");
  const [filtreStatut, setFiltreStatut] = useState("tous");
  const [actionId, setActionId] = useState(null);

  async function charger() {
    try {
      const d = await rpc("rpc_admin_tous_examens", { p_token: session.token });
      setExamens(d.examens);
      setErreur("");
    } catch (e) { setErreur(e.message); }
  }
  useEffect(() => { charger(); }, []);

  async function dupliquer(ex) {
    setActionId(ex.id);
    try {
      const d = await rpc("rpc_dupliquer_examen", { p_token: session.token, p_examen_id: ex.id });
      await charger();
      onOuvrirEditeur(d.id);
    } catch (e) { setErreur(e.message); } finally { setActionId(null); }
  }

  async function repasserBrouillon(ex) {
    if (!window.confirm("Repasser « " + ex.titre + " » en brouillon ?")) return;
    setActionId(ex.id);
    try {
      await rpc("rpc_repasser_brouillon", { p_token: session.token, p_examen_id: ex.id });
      await charger();
    } catch (e) { setErreur(e.message); } finally { setActionId(null); }
  }

  if (erreur) return <div className="error-msg">{erreur} <button className="linkbtn" onClick={charger}>Réessayer</button></div>;
  if (!examens) return <p>Chargement…</p>;

  const filtres = examens.filter(ex => {
    if (filtreStatut !== "tous" && ex.statut !== filtreStatut) return false;
    if (!recherche) return true;
    const r = recherche.toLowerCase();
    return ex.titre.toLowerCase().includes(r) ||
      (ex.enseignant_nom || "").toLowerCase().includes(r) ||
      (ex.enseignant_prenom || "").toLowerCase().includes(r) ||
      (ex.enseignant_matricule || "").toLowerCase().includes(r);
  });

  return (
    <div>
      <div className="row" style={{ marginBottom: 14 }}>
        <div className="field"><label>Rechercher (titre, enseignant, matricule)</label><input type="text" value={recherche} onChange={e => setRecherche(e.target.value)} /></div>
        <div className="field">
          <label>Statut</label>
          <select value={filtreStatut} onChange={e => setFiltreStatut(e.target.value)}>
            <option value="tous">Tous</option>
            <option value="brouillon">Brouillon</option>
            <option value="publie">Publié</option>
            <option value="clos">Clos</option>
          </select>
        </div>
      </div>

      {filtres.length === 0 ? <p className="info-msg">Aucun devoir ne correspond.</p> : filtres.map(ex => (
        <div className="card" key={ex.id}>
          <div className="list-row" style={{ padding: 0, border: "none", alignItems: "flex-start" }}>
            <div>
              <h3 style={{ marginBottom: 4 }}>{ex.titre}</h3>
              <span className={"badge badge-" + ex.statut}>{ex.statut}</span>
              <span style={{ marginLeft: 8, fontSize: ".8rem", color: "var(--ink-faint)" }}>
                {ex.classes_cibles && ex.classes_cibles.length ? ex.classes_cibles.join(", ") : "toutes classes"}
              </span>
              <div style={{ fontSize: ".8rem", color: "var(--ink-faint)", marginTop: 4 }}>
                Par {ex.enseignant_prenom} {ex.enseignant_nom} <span style={{ fontFamily: "var(--font-mono)" }}>({ex.enseignant_matricule})</span>
                {" · "}{ex.nb_questions} question(s) · {ex.nb_compositions_en_cours} en cours · {ex.nb_compositions_terminees} terminée(s)
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "flex-end" }}>
              <button className="btn btn-sm btn-outline" onClick={() => onOuvrirEditeur(ex.id)}>Ouvrir</button>
              <button className="btn btn-sm btn-outline" onClick={() => onOuvrirResultats(ex)}>Résultats</button>
              {ex.statut === "publie" && (
                <button className="btn btn-sm btn-outline" disabled={actionId === ex.id} onClick={() => repasserBrouillon(ex)}>Repasser en brouillon</button>
              )}
              {(ex.statut === "publie" || ex.statut === "clos") && (
                <button className="btn btn-sm btn-outline" disabled={actionId === ex.id} onClick={() => dupliquer(ex)}>Dupliquer</button>
              )}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminEleves({ session }) {
  const [classes, setClasses] = useState(null);
  const [classeActive, setClasseActive] = useState("");
  const [recherche, setRecherche] = useState("");
  const [eleves, setEleves] = useState(null);
  const [erreur, setErreur] = useState("");
  const [confirmation, setConfirmation] = useState("");
  const [selection, setSelection] = useState({});
  const [classeCible, setClasseCible] = useState("");
  const [edition, setEdition] = useState(null);
  const [ajoutOuvert, setAjoutOuvert] = useState(false);
  const [nouveau, setNouveau] = useState({ matricule: "", nom: "", prenom: "", classe: "" });
  const [importEnCours, setImportEnCours] = useState(false);
  const [rapportImport, setRapportImport] = useState(null);
  const fileRef = useRef(null);

  async function chargerClasses() {
    try {
      const d = await rpc("rpc_admin_classes_avec_effectif", { p_token: session.token });
      setClasses(d.classes);
    } catch (e) { setErreur(e.message); }
  }
  async function chargerEleves() {
    try {
      const d = await rpc("rpc_admin_liste_eleves", { p_token: session.token, p_classe: classeActive || null, p_recherche: recherche || null });
      setEleves(d.eleves);
      setErreur("");
    } catch (e) { setErreur(e.message); }
  }
  useEffect(() => { chargerClasses(); }, []);
  useEffect(() => { chargerEleves(); }, [classeActive]);

  function chercher(e) { e.preventDefault(); chargerEleves(); }

  function basculerSelection(matricule) {
    setSelection(s => { const n = { ...s }; if (n[matricule]) delete n[matricule]; else n[matricule] = true; return n; });
  }
  const matriculesSelectionnes = Object.keys(selection);

  async function deplacerSelection() {
    if (!classeCible || matriculesSelectionnes.length === 0) return;
    try {
      const d = await rpc("rpc_admin_deplacer_eleves", { p_token: session.token, p_matricules: matriculesSelectionnes, p_nouvelle_classe: classeCible });
      setConfirmation(d.nb_deplaces + " élève(s) déplacé(s) vers " + classeCible + ".");
      setTimeout(() => setConfirmation(""), 4000);
      setSelection({});
      setClasseCible("");
      await Promise.all([chargerClasses(), chargerEleves()]);
    } catch (e) { setErreur(e.message); }
  }

  async function ajouterEleve(e) {
    e.preventDefault();
    try {
      await rpc("rpc_admin_ajouter_eleve", { p_token: session.token, p_matricule: nouveau.matricule, p_nom: nouveau.nom, p_prenom: nouveau.prenom, p_classe: nouveau.classe });
      setNouveau({ matricule: "", nom: "", prenom: "", classe: "" });
      setAjoutOuvert(false);
      setErreur("");
      await Promise.all([chargerClasses(), chargerEleves()]);
    } catch (e) { setErreur(e.message); }
  }

  async function enregistrerEdition() {
    try {
      await rpc("rpc_admin_modifier_eleve", { p_token: session.token, p_matricule: edition.matricule, p_nom: edition.nom, p_prenom: edition.prenom, p_classe: edition.classe });
      setEdition(null);
      setErreur("");
      await Promise.all([chargerClasses(), chargerEleves()]);
    } catch (e) { setErreur(e.message); }
  }

  async function supprimer(matricule) {
    if (!window.confirm("Retirer " + matricule + " de la liste officielle des élèves ?")) return;
    try {
      await rpc("rpc_admin_supprimer_eleve", { p_token: session.token, p_matricule: matricule });
      await Promise.all([chargerClasses(), chargerEleves()]);
    } catch (e) { setErreur(e.message); }
  }

  function cleColonne(obj, cles) {
    for (const c of cles) { if (obj[c] != null && String(obj[c]).trim() !== "") return String(obj[c]).trim(); }
    return "";
  }

  async function importerFichier(e) {
    const fichier = e.target.files && e.target.files[0];
    if (!fichier) return;
    setImportEnCours(true);
    setRapportImport(null);
    try {
      const buffer = await fichier.arrayBuffer();
      const wb = XLSX.read(buffer, { type: "array" });
      const feuille = wb.Sheets[wb.SheetNames[0]];
      const lignesBrutes = XLSX.utils.sheet_to_json(feuille, { defval: "" });
      const lignes = lignesBrutes.map(l => ({
        matricule: cleColonne(l, ["matricule", "Matricule", "MATRICULE"]),
        nom: cleColonne(l, ["nom", "Nom", "NOM"]),
        prenom: cleColonne(l, ["prenom", "Prénom", "Prenom", "PRENOM"]),
        classe: cleColonne(l, ["classe", "Classe", "CLASSE"]),
      })).filter(l => l.matricule);
      if (lignes.length === 0) {
        setErreur("Aucune ligne exploitable trouvée. Vérifiez les en-têtes de colonnes (matricule, nom, prenom, classe).");
      } else {
        const d = await rpc("rpc_admin_import_eleves", { p_token: session.token, p_lignes: lignes });
        setRapportImport(d);
        setErreur("");
        await Promise.all([chargerClasses(), chargerEleves()]);
      }
    } catch (err) {
      setErreur(err.message);
    } finally {
      setImportEnCours(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }

  return (
    <div>
      {erreur && <div className="error-msg">{erreur}</div>}
      {confirmation && <div className="info-msg" style={{ background: "var(--success-soft)", color: "var(--success)" }}>{confirmation}</div>}

      <div className="card">
        <h3>Classes</h3>
        <div className="qtype-grid">
          <button type="button" className={"qtype-opt" + (classeActive === "" ? " active" : "")} onClick={() => setClasseActive("")}>Toutes</button>
          {(classes || []).map(c => (
            <button type="button" key={c.classe} className={"qtype-opt" + (classeActive === c.classe ? " active" : "")} onClick={() => setClasseActive(c.classe)}>
              {c.classe} <span style={{ opacity: .6 }}>({c.nb_comptes_crees}/{c.nb_autorises})</span>
            </button>
          ))}
          {classes && classes.length === 0 && <span style={{ fontSize: ".82rem", color: "var(--ink-faint)" }}>Aucune classe pour l'instant.</span>}
        </div>
      </div>

      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <h3 style={{ marginBottom: 0 }}>Élèves {classeActive ? "— " + classeActive : ""}</h3>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" className="btn btn-sm btn-outline" onClick={() => setAjoutOuvert(!ajoutOuvert)}>+ Ajouter un élève</button>
            <label className="btn btn-sm btn-outline" style={{ cursor: "pointer", marginBottom: 0 }}>
              {importEnCours ? "Import en cours…" : "Importer un fichier Excel"}
              <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={importerFichier} disabled={importEnCours} />
            </label>
          </div>
        </div>

        {ajoutOuvert && (
          <form onSubmit={ajouterEleve} style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--line-soft)" }}>
            <div className="row">
              <div className="field"><label>Matricule</label><input type="text" required value={nouveau.matricule} onChange={e => setNouveau({ ...nouveau, matricule: e.target.value })} /></div>
              <div className="field"><label>Nom</label><input type="text" required value={nouveau.nom} onChange={e => setNouveau({ ...nouveau, nom: e.target.value })} /></div>
            </div>
            <div className="row">
              <div className="field"><label>Prénom</label><input type="text" value={nouveau.prenom} onChange={e => setNouveau({ ...nouveau, prenom: e.target.value })} /></div>
              <div className="field"><label>Classe</label><input type="text" required value={nouveau.classe} onChange={e => setNouveau({ ...nouveau, classe: e.target.value })} /></div>
            </div>
            <button className="btn btn-accent btn-sm">Ajouter à la liste officielle</button>
          </form>
        )}

        {rapportImport && (
          <div className="info-msg" style={{ marginTop: 14 }}>
            Import terminé : {rapportImport.nb_importes} ligne(s) importée(s){rapportImport.nb_erreurs > 0 ? ", " + rapportImport.nb_erreurs + " erreur(s)" : ""}.
            {rapportImport.nb_erreurs > 0 && (
              <ul style={{ marginTop: 6, paddingLeft: 18 }}>
                {rapportImport.erreurs.slice(0, 10).map((er, i) => (
                  <li key={i} style={{ fontSize: ".78rem" }}>{JSON.stringify(er.ligne)} — {er.raison}</li>
                ))}
              </ul>
            )}
          </div>
        )}

        <form onSubmit={chercher} style={{ marginTop: 14, display: "flex", gap: 8 }}>
          <input type="text" placeholder="Rechercher un nom, prénom ou matricule…" value={recherche} onChange={e => setRecherche(e.target.value)} style={{ flex: 1 }} />
          <button className="btn btn-outline btn-sm">Rechercher</button>
        </form>

        {matriculesSelectionnes.length > 0 && (
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", margin: "14px 0", padding: "10px 12px", background: "var(--line-soft)", borderRadius: "var(--radius)" }}>
            <span style={{ fontSize: ".85rem" }}>{matriculesSelectionnes.length} élève(s) sélectionné(s)</span>
            <select value={classeCible} onChange={e => setClasseCible(e.target.value)} style={{ maxWidth: 200 }}>
              <option value="">Déplacer vers…</option>
              {(classes || []).map(c => <option key={c.classe} value={c.classe}>{c.classe}</option>)}
            </select>
            <button className="btn btn-sm btn-accent" disabled={!classeCible} onClick={deplacerSelection}>Déplacer la sélection</button>
            <button className="linkbtn" onClick={() => setSelection({})}>Annuler la sélection</button>
          </div>
        )}

        {!eleves ? <p>Chargement…</p> : eleves.length === 0 ? <p className="info-msg">Aucun élève trouvé.</p> : (
          <table className="results" style={{ marginTop: 10 }}>
            <thead><tr><th></th><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Classe</th><th>Compte</th><th></th></tr></thead>
            <tbody>
              {eleves.map(el => (
                edition && edition.matricule === el.matricule ? (
                  <tr key={el.matricule}>
                    <td></td>
                    <td style={{ fontFamily: "var(--font-mono)" }}>{el.matricule}</td>
                    <td><input type="text" value={edition.nom} onChange={e => setEdition({ ...edition, nom: e.target.value })} /></td>
                    <td><input type="text" value={edition.prenom} onChange={e => setEdition({ ...edition, prenom: e.target.value })} /></td>
                    <td><input type="text" value={edition.classe} onChange={e => setEdition({ ...edition, classe: e.target.value })} /></td>
                    <td></td>
                    <td style={{ display: "flex", gap: 6 }}>
                      <button className="btn btn-sm btn-accent" onClick={enregistrerEdition}>Enregistrer</button>
                      <button className="btn btn-sm btn-outline" onClick={() => setEdition(null)}>Annuler</button>
                    </td>
                  </tr>
                ) : (
                  <tr key={el.matricule}>
                    <td><input type="checkbox" checked={!!selection[el.matricule]} onChange={() => basculerSelection(el.matricule)} /></td>
                    <td style={{ fontFamily: "var(--font-mono)" }}>{el.matricule}</td>
                    <td>{el.nom}</td>
                    <td>{el.prenom}</td>
                    <td>{el.classe}</td>
                    <td>{el.compte_cree ? <span className="note-badge note-ok">créé</span> : <span style={{ fontSize: ".78rem", color: "var(--ink-faint)" }}>non créé</span>}</td>
                    <td style={{ display: "flex", gap: 6 }}>
                      <button className="btn btn-sm btn-outline" onClick={() => setEdition({ matricule: el.matricule, nom: el.nom, prenom: el.prenom, classe: el.classe })}>Modifier</button>
                      <button className="btn btn-sm btn-danger" onClick={() => supprimer(el.matricule)}>Retirer</button>
                    </td>
                  </tr>
                )
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function AdminEnseignants({ session }) {
  const [liste, setListe] = useState(null);
  const [erreur, setErreur] = useState("");
  const [actionMatricule, setActionMatricule] = useState(null);

  async function charger() {
    try {
      const d = await rpc("rpc_admin_liste_enseignants", { p_token: session.token });
      setListe(d.enseignants);
      setErreur("");
    } catch (e) { setErreur(e.message); }
  }
  useEffect(() => { charger(); }, []);

  async function basculerAdmin(ens) {
    if (!window.confirm(ens.est_admin
      ? "Retirer les droits d'administrateur à " + ens.prenom + " " + ens.nom + " ?"
      : "Faire de " + ens.prenom + " " + ens.nom + " un administrateur ?")) return;
    setActionMatricule(ens.matricule);
    try {
      await rpc("rpc_admin_definir_admin", { p_token: session.token, p_matricule_cible: ens.matricule, p_valeur: !ens.est_admin });
      await charger();
    } catch (e) { setErreur(e.message); } finally { setActionMatricule(null); }
  }

  if (erreur) return <div className="error-msg">{erreur} <button className="linkbtn" onClick={charger}>Réessayer</button></div>;
  if (!liste) return <p>Chargement…</p>;

  return (
    <div className="card">
      <h3>Comptes enseignants</h3>
      <table className="results">
        <thead><tr><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Devoirs créés</th><th>Rôle</th><th></th></tr></thead>
        <tbody>
          {liste.map(ens => (
            <tr key={ens.id}>
              <td style={{ fontFamily: "var(--font-mono)" }}>{ens.matricule}</td>
              <td>{ens.nom}</td>
              <td>{ens.prenom}</td>
              <td>{ens.nb_examens}</td>
              <td>{ens.est_admin ? <span className="note-badge note-ok">Administrateur</span> : <span style={{ fontSize: ".78rem", color: "var(--ink-faint)" }}>Enseignant</span>}</td>
              <td>
                <button className="btn btn-sm btn-outline" disabled={actionMatricule === ens.matricule} onClick={() => basculerAdmin(ens)}>
                  {ens.est_admin ? "Retirer l'accès admin" : "Promouvoir administrateur"}
                </button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function TopBar({ session, onDeconnexion }) {
  return (
    <div className="topbar">
      <div className="brand">
        <img className="brand-seal" src={LOGO_CAFOP} alt="Logo du CAFOP" />
        <div className="brand-text">
          <div className="title">Composition</div>
          <div className="sub">{NOM_ETABLISSEMENT}</div>
        </div>
      </div>
      <div className="who">
        {session.nom} {session.prenom} <span className="matricule">({session.matricule})</span>
        <button className="linkbtn" onClick={onDeconnexion}>Se déconnecter</button>
      </div>
    </div>

}

// ============================================================
// ESPACE ELEVE
// ============================================================
function EspaceEleve({ session, onDeconnexion }) {
  const [examens, setExamens] = useState(null);
  const [confirmation, setConfirmation] = useState(null); // examen sélectionné, pas encore démarré
  const [enCours, setEnCours] = useState(null);   // examen en cours de passation
  const [resultatFinal, setResultatFinal] = useState(null);
  const [erreurListe, setErreurListe] = useState("");

  async function recharger() {
    try {
      const d = await rpc("rpc_examens_disponibles", { p_token: session.token });
      setExamens(d.examens);
      setErreurListe("");
    } catch (e) { setErreurListe(e.message); }
  }
  useEffect(() => { recharger(); }, []);

  if (confirmation) {
    return (
      <div className="center-screen">
        <div className="login-card" style={{ maxWidth: 480 }}>
          <h2>{confirmation.titre}</h2>
          <p style={{ color: "var(--ink-soft)" }}>
            La composition passera en plein écran. Ne changez pas d'onglet, ne quittez pas le plein écran :
            ces actions sont enregistrées. Chaque question a son propre chronomètre — une fois le temps
            écoulé, la question suivante s'affiche automatiquement.
          </p>
          <button className="btn btn-accent" style={{ width: "100%", justifyContent: "center", marginTop: 10 }}
            onClick={() => {
              const el = document.documentElement;
              if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
              setEnCours(confirmation);
              setConfirmation(null);
            }}>
            Commencer la composition
          </button>
          <button className="btn btn-outline" style={{ width: "100%", justifyContent: "center", marginTop: 8 }} onClick={() => setConfirmation(null)}>Annuler</button>
        </div>
      </div>
    );
  }

  if (enCours) {
    return <PassationExamen session={session} examen={enCours} onTermine={(res) => { setEnCours(null); setResultatFinal(res); }} />;
  }

  if (resultatFinal) {
    return (
      <div className="center-screen">
        <div className="login-card" style={{ textAlign: "center", maxWidth: 460 }}>
          <h2>Composition terminée</h2>
          <p style={{ color: "var(--ink-soft)" }}>Votre copie a été corrigée automatiquement.</p>
          <div className={"note-badge " + (resultatFinal.note_sur_20 >= 10 ? "note-ok" : "note-bas")} style={{ fontSize: "2rem", padding: "10px 26px", display: "inline-block", margin: "16px 0" }}>
            {resultatFinal.note_sur_20} / 20
          </div>
          <p style={{ fontSize: ".85rem", color: "var(--ink-faint)" }}>{resultatFinal.score_total} points sur {resultatFinal.score_max}</p>
          <button className="btn btn-accent" style={{ marginTop: 12 }} onClick={() => { setResultatFinal(null); recharger(); }}>Retour à mes examens</button>
        </div>
      </div>
    );
  }

  function demarrer(ex) {
    setConfirmation(ex);
  }

  return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <div className="container">
        <h2 style={{ marginBottom: 18 }}>Examens disponibles</h2>
        {erreurListe && <div className="error-msg">{erreurListe} <button className="linkbtn" onClick={recharger}>Réessayer</button></div>}
        {!examens ? (erreurListe ? null : <p>Chargement…</p>) : examens.length === 0 ? <p className="info-msg">Aucun examen disponible pour le moment.</p> : examens.map(ex => {
          const epuise = ex.tentatives_utilisees >= ex.tentatives_max;
          return (
            <div className="card" key={ex.id}>
              <div className="list-row" style={{ padding: 0, border: "none" }}>
                <div>
                  <h3 style={{ marginBottom: 4 }}>{ex.titre}</h3>
                  <p style={{ color: "var(--ink-soft)", marginBottom: 4 }}>{ex.description}</p>
                  <span style={{ fontSize: ".8rem", color: "var(--ink-faint)" }}>
                    {ex.nb_questions} question{ex.nb_questions > 1 ? "s" : ""} · tentative {ex.tentatives_utilisees + 1} / {ex.tentatives_max}
                  </span>
                </div>
                <button className="btn btn-accent" disabled={epuise} onClick={() => demarrer(ex)}>
                  {epuise ? "Tentatives épuisées" : "Composer"}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// ============================================================
// RACINE DE L'APPLICATION
// ============================================================
function App() {
  const [session, setSession] = useState(() => loadSession());
  const [motifDeconnexion, setMotifDeconnexion] = useState("");

  function deconnexion() { clearSession(); setSession(null); setMotifDeconnexion(""); }

  useEffect(() => {
    signalerSessionExpiree = () => {
      clearSession();
      setSession(null);
      setMotifDeconnexion("Votre session a expiré après un moment d'inactivité. Reconnectez-vous.");
    };
    return () => { signalerSessionExpiree = null; };
  }, []);

  if (!session) return <LoginScreen onLogin={(s) => { setMotifDeconnexion(""); setSession(s); }} messageInitial={motifDeconnexion} />;
  if (session.role === "enseignant") return <EspaceEnseignant session={session} onDeconnexion={deconnexion} />;
  return <EspaceEleve session={session} onDeconnexion={deconnexion} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
