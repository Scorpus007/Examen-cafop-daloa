<style>
:root{
  --ink:#1B2A4A; --ink-soft:#3C4A66; --ink-faint:#7C88A0;
  --paper:#EEF0EA; --surface:#FFFFFF; --line:#D6D2C4; --line-soft:#E4E1D4;
  --accent:#C1442D; --accent-soft:#F3DAD3; --accent-deep:#8F3020;
  --success:#2F6B4F; --success-soft:#DCE9E1;
  --warning:#B8860B; --warning-soft:#F3E6C4;
  --font-display:'Spectral',serif; --font-body:'Public Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; color:var(--ink); margin:0 0 .3em 0;}
h1{font-size:1.9rem;} h2{font-size:1.35rem;} h3{font-size:1.05rem;}
p{margin:0 0 .8em 0;}
a{color:var(--accent-deep);}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body); font-size:.95rem;}
::selection{background:var(--accent-soft);}

.topbar{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:22px 34px; border-bottom:1px solid var(--line); background:var(--surface);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-seal{
  width:40px; height:40px; flex-shrink:0; object-fit:contain;
}
.brand-seal-lg{width:76px; height:76px; object-fit:contain; flex-shrink:0;}
.brand-text .title{font-family:var(--font-display); font-size:1.25rem; font-weight:600;}
.brand-text .sub{font-size:.82rem; color:var(--ink-faint);}
.who{font-size:.85rem; color:var(--ink-soft); text-align:right;}
.who .matricule{font-family:var(--font-mono); color:var(--ink);}
.linkbtn{
  background:none; border:none; color:var(--accent-deep); font-size:.85rem;
  text-decoration:underline; padding:0; margin-left:10px;
}

.container{max-width:900px; margin:0 auto; padding:34px;}
.container-wide{max-width:1180px; margin:0 auto; padding:34px;}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:18px;
}
.field{margin-bottom:16px;}
.field label{display:block; font-size:.82rem; color:var(--ink-soft); margin-bottom:5px; font-weight:500;}
.field input[type=text],.field input[type=password],.field input[type=number],
.field input[type=datetime-local],.field select,.field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); color:var(--ink);
}
.field textarea{min-height:80px; resize:vertical;}
.row{display:flex; gap:14px;}
.row > .field{flex:1;}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--radius);
  border:1px solid var(--ink); background:var(--ink); color:#fff; font-size:.9rem; font-weight:500;
}
.btn:hover{background:var(--ink-soft);}
.btn-outline{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-outline:hover{border-color:var(--ink);}
.btn-accent{background:var(--accent); border-color:var(--accent);}
.btn-accent:hover{background:var(--accent-deep);}
.btn-danger{background:transparent; color:var(--accent-deep); border:1px solid var(--accent-soft);}
.btn-sm{padding:5px 11px; font-size:.8rem;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:22px;}
.tab{padding:10px 4px; margin-right:22px; font-size:.92rem; color:var(--ink-faint); border-bottom:2px solid transparent; background:none; border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--ink); border-bottom-color:var(--accent); font-weight:600;}

.list-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:15px 0; border-bottom:1px solid var(--line-soft);
}
.list-row:last-child{border-bottom:none;}
.badge{
  display:inline-block; font-size:.72rem; padding:2px 9px; border-radius:20px; font-weight:600;
  letter-spacing:.02em;
}
.badge-brouillon{background:var(--warning-soft); color:var(--warning);}
.badge-publie{background:var(--success-soft); color:var(--success);}
.badge-clos{background:#EAEAEA; color:#666;}

.error-msg{background:var(--accent-soft); color:var(--accent-deep); padding:10px 13px; border-radius:var(--radius); font-size:.87rem; margin-bottom:14px;}
.info-msg{background:var(--line-soft); color:var(--ink-soft); padding:10px 13px; border-radius:var(--radius); font-size:.85rem; margin-bottom:14px;}

.qtype-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:18px;}
.qtype-opt{
  border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font-size:.85rem;
  background:var(--surface); text-align:left;
}
.qtype-opt.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep); font-weight:600;}

.question-item{border:1px solid var(--line-soft); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
.question-item .meta{font-size:.78rem; color:var(--ink-faint); font-family:var(--font-mono);}

.opt-row{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
.opt-row input[type=text]{flex:1;}

/* --- Passation --- */
.exam-shell{min-height:100vh; display:flex; flex-direction:column; background:var(--ink);}
.exam-header{
  display:flex; justify-content:space-between; align-items:center; padding:16px 30px;
  color:#fff; font-family:var(--font-mono); font-size:.85rem; border-bottom:1px solid rgba(255,255,255,.15);
}
.chrono{
  font-family:var(--font-mono); font-size:1.4rem; font-weight:600; color:#fff;
  padding:4px 14px; border:1.5px solid rgba(255,255,255,.35); border-radius:var(--radius);
}
.chrono.low{color:var(--accent); border-color:var(--accent); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.exam-body{flex:1; display:flex; align-items:flex-start; justify-content:center; padding:50px 20px;}
.question-card{
  background:var(--surface); border-radius:6px; max-width:680px; width:100%; padding:36px 40px;
}
.question-card .qnum{font-family:var(--font-mono); font-size:.78rem; color:var(--ink-faint); margin-bottom:10px;}
.question-card .enonce{font-family:var(--font-display); font-size:1.25rem; margin-bottom:22px; line-height:1.4;}
.question-card img{max-width:100%; border-radius:4px; margin-bottom:18px; border:1px solid var(--line);}
.choice-row{
  display:flex; align-items:center; gap:11px; padding:11px 14px; border:1px solid var(--line);
  border-radius:var(--radius); margin-bottom:8px;
}
.choice-row:hover{border-color:var(--ink-faint);}
.choice-row.selected{border-color:var(--accent); background:var(--accent-soft);}
.blank-input{
  font-family:var(--font-mono); border:none; border-bottom:2px solid var(--accent);
  background:transparent; padding:2px 4px; width:130px; font-size:1rem; color:var(--ink);
}
.trou-texte{font-family:var(--font-display); font-size:1.2rem; line-height:2.1;}
.warning-banner{
  background:var(--accent); color:#fff; padding:10px 20px; font-size:.85rem; text-align:center;
}
.exam-footer{display:flex; justify-content:flex-end; padding:20px 40px 40px; max-width:680px; margin:0 auto; width:100%;}
.dragitem{
  padding:10px 13px; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:6px;
  background:var(--surface); display:flex; justify-content:space-between; align-items:center;
}
.dragitem .handles button{background:none;border:1px solid var(--line);border-radius:3px;font-size:.7rem;padding:2px 7px;margin-left:3px;}

table.results{width:100%; border-collapse:collapse; font-size:.88rem;}
table.results th{text-align:left; font-weight:600; color:var(--ink-soft); border-bottom:1px solid var(--line); padding:8px 10px; font-size:.78rem;}
table.results td{padding:9px 10px; border-bottom:1px solid var(--line-soft);}
table.results tr:hover{background:var(--paper);}

.note-badge{font-family:var(--font-mono); font-weight:600; padding:2px 8px; border-radius:3px;}
.note-ok{background:var(--success-soft); color:var(--success);}
.note-bas{background:var(--accent-soft); color:var(--accent-deep);}

.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:38px 36px;}
.role-toggle{display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:22px;}
.role-toggle button{flex:1; padding:10px; border:none; background:var(--surface); font-size:.88rem; color:var(--ink-faint);}
.role-toggle button.active{background:var(--ink); color:#fff;}
.small-link{font-size:.82rem; text-align:center; margin-top:14px;}
/* ============================================================
   RESPONSIVE — smartphone (Android/iOS) et petites fenêtres
   ============================================================ */
@media (max-width: 680px){
  .topbar{padding:14px 16px; flex-wrap:wrap; gap:8px;}
  .who{font-size:.78rem; text-align:left;}
  .container, .container-wide{padding:16px;}
  .login-card{padding:26px 20px; max-width:100%;}
  .card{padding:16px;}
  .row{flex-direction:column; gap:0;}
  .qtype-grid{grid-template-columns:1fr;}
  h1{font-size:1.5rem;} h2{font-size:1.15rem;} h3{font-size:1rem;}
  .btn{padding:11px 16px; font-size:.92rem;}
  .btn-sm{padding:8px 12px;}
  table.results{display:block; overflow-x:auto; white-space:nowrap;}
  .exam-header{flex-direction:column; align-items:flex-start; gap:8px; padding:12px 16px;}
  .exam-body{padding:20px 12px;}
  .question-card{padding:22px 18px;}
  .question-card .enonce{font-size:1.08rem;}
  .exam-footer{padding:14px 16px 28px; max-width:100%;}
  .chrono{font-size:1.1rem; padding:3px 10px;}
  .dragitem, .opt-row{flex-wrap:wrap;}
  .brand-text .title{font-size:1.1rem;}
}
@media (max-width: 420px){
  .role-toggle button{font-size:.82rem; padding:9px 4px;}
  .login-card form > .btn{width:100%; justify-content:center;}
}
</style>

const MAX_QUESTIONS_PAR_EXAMEN = 50; // limite modifiable ; le serveur applique la même limite
const BUCKET_IMAGES_QUESTIONS = "images-questions"; // images importées pour les questions (voir migration_v5_medias.sql)
const TAILLE_MAX_IMAGE_MO = 8;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let signalerSessionExpiree = null; // branché par le composant App

async function rpc(fn, params) {
  const { data, error } = await sb.rpc(fn, params);
  if (error) throw new Error(error.message);
  if (data && data.succes === false) {
    const err = new Error(data.erreur || "Erreur");
    err.data = data;
    if (data.erreur === "Session expirée" && signalerSessionExpiree) signalerSessionExpiree();
    throw err;
  }
  return data;
}

function uid() { return Math.random().toString(36).slice(2, 10); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function saveSession(s) { localStorage.setItem("cafop_examen_session", JSON.stringify(s)); }
function loadSession() {
  try { return JSON.parse(localStorage.getItem("cafop_examen_session")); } catch (e) { return null; }
}
function clearSession() { localStorage.removeItem("cafop_examen_session"); }

function fmtChrono(sec) {
  if (sec == null || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

  { id: "vrai_faux", label: "Vrai ou faux" },

  { id: "calcul", label: "Calcul / résolution de problème" },
  { id: "depot_fichier", label: "Dépôt de fichier" },
];
const TYPES_CORRECTION_MANUELLE = ["reponse_longue", "depot_fichier"];
function typeLabel(id) { const t = TYPES.find(t => t.id === id); return t ? t.label : id; }

// Reconnaît un lien YouTube / Vimeo pour l'intégrer en lecteur ; sinon,
// s'il pointe vers un fichier vidéo direct (.mp4/.webm/.ogg), utilise un
// lecteur HTML natif ; sinon, simple lien à ouvrir.
function infosVideo(url) {
  if (!url) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  if (yt) return { mode: "iframe", src: "https://www.youtube.com/embed/" + yt[1] };
  const vim = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vim) return { mode: "iframe", src: "https://player.vimeo.com/video/" + vim[1] };
  if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) return { mode: "fichier", src: url };
  return { mode: "lien", src: url };
}

function LecteurVideo({ url }) {
  const info = infosVideo(url);
  if (!info) return null;
  if (info.mode === "iframe") {
    return (
      <div style={{ position: "relative", paddingTop: "56.25%", borderRadius: 4, overflow: "hidden", background: "#000", marginBottom: 14 }}>
        <iframe src={info.src} title="Vidéo de la question"
          style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }}
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen />
      </div>
    );
  }
  if (info.mode === "fichier") {
    return <video src={info.src} controls style={{ width: "100%", borderRadius: 4, marginBottom: 14, background: "#000" }} />;
  }
  return (
    <div className="info-msg" style={{ marginBottom: 14 }}>
      <a href={info.src} target="_blank" rel="noopener noreferrer">▶ Ouvrir la vidéo dans un nouvel onglet ↗</a>
    </div>
  );
}

// Parse la syntaxe d'auteur des textes à trous : {{réponse/autre forme}}
function parseTexteTrous(brut) {
  let n = 0;
  const correct = {};
  const affiche = brut.replace(/\{\{([^}]+)\}\}/g, (m, inner) => {
    n += 1;
    correct[String(n)] = inner.split("/").map(s => s.trim()).filter(Boolean);
    return "___" + n + "___";
  });
  return { texte_affiche: affiche, correct, nb_trous: n };
}

// ============================================================
// CHRONO PAR QUESTION
// ============================================================
function Timer({ seconds, onExpire, questionKey }) {
  const [left, setLeft] = useState(seconds);
  useEffect(() => {
    setLeft(seconds);
    const start = Date.now();
    const iv = setInterval(() => {
      const elapsed = Math.floor((Date.now() - start) / 1000);
      const remain = seconds - elapsed;
      if (remain <= 0) {
        setLeft(0);
        clearInterval(iv);
        onExpire();
      } else {
        setLeft(remain);
      }
    }, 250);
    return () => clearInterval(iv);
  }, [questionKey, seconds]);
  return <div className={"chrono" + (left <= 10 ? " low" : "")}>{fmtChrono(left)}</div>;
}

// ============================================================
// ANTI-TRICHE
// ============================================================
function useAntiTriche(actif, niveau, onEvenement) {
  useEffect(() => {
    if (!actif) return;

    function demanderPleinEcran() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }
    demanderPleinEcran();

    function onVisibility() {
      if (document.hidden) onEvenement("changement_onglet", "L'élève a quitté l'onglet ou minimisé la fenêtre");
    }
    function onFullscreenChange() {
      if (!document.fullscreenElement) onEvenement("sortie_plein_ecran", "Sortie du mode plein écran");
    }
    function onBlur() { onEvenement("perte_focus", "La fenêtre a perdu le focus"); }
    function blockEvent(nom) {
      return (e) => { e.preventDefault(); if (niveau === "avance") onEvenement(nom, "Tentative de " + nom); };
    }
    const onCopy = blockEvent("copier");
    const onCut = blockEvent("couper");
    const onPaste = blockEvent("coller");
    const onContext = blockEvent("clic_droit");

    document.addEventListener("visibilitychange", onVisibility);
    document.addEventListener("fullscreenchange", onFullscreenChange);
    window.addEventListener("blur", onBlur);
    if (niveau === "avance") {
      document.addEventListener("copy", onCopy);
      document.addEventListener("cut", onCut);
      document.addEventListener("paste", onPaste);
      document.addEventListener("contextmenu", onContext);
    }
    return () => {
      document.removeEventListener("visibilitychange", onVisibility);
      document.removeEventListener("fullscreenchange", onFullscreenChange);
      window.removeEventListener("blur", onBlur);
      document.removeEventListener("copy", onCopy);
      document.removeEventListener("cut", onCut);
      document.removeEventListener("paste", onPaste);
      document.removeEventListener("contextmenu", onContext);
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    };
  }, [actif, niveau]);
}

function QuestionEditor({ onSave, onCancel, ordre, existant }) {
  const e0 = existant || {};
  const d0 = e0.donnees || {};
  const rc0 = e0.reponse_correcte || {};

  const [type, setType] = useState(e0.type || "qcm");
  const [enonce, setEnonce] = useState(e0.enonce || "");
  const [description, setDescription] = useState(e0.description || "");
  const [imageUrl, setImageUrl] = useState(e0.image_url || "");
  const [televersementEnCours, setTeleversementEnCours] = useState(false);
  const [erreurTeleversement, setErreurTeleversement] = useState("");
  const [points, setPoints] = useState(e0.points != null ? e0.points : 1);
  const [tempsLimite, setTempsLimite] = useState(e0.temps_limite_secondes || 60);

  async function televerserImage(fichier) {
    if (!fichier) return;
    if (!fichier.type.startsWith("image/")) { setErreurTeleversement("Choisissez un fichier image (jpg, png, gif…)."); return; }
    if (fichier.size > TAILLE_MAX_IMAGE_MO * 1024 * 1024) { setErreurTeleversement("Image trop volumineuse (" + TAILLE_MAX_IMAGE_MO + " Mo maximum)."); return; }
    setErreurTeleversement("");
    setTeleversementEnCours(true);
    try {
      const chemin = Date.now() + "-" + uid() + "-" + fichier.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const { error } = await sb.storage.from(BUCKET_IMAGES_QUESTIONS).upload(chemin, fichier);
      if (error) throw error;
      const { data } = sb.storage.from(BUCKET_IMAGES_QUESTIONS).getPublicUrl(chemin);
      setImageUrl(data.publicUrl);
    } catch (err) {
      setErreurTeleversement("Échec de l'envoi de l'image. Vérifiez votre connexion et réessayez.");
    } finally {
      setTeleversementEnCours(false);
    }
  }

  const [options, setOptions] = useState(
    (d0.options && d0.options.length) ? d0.options.map(o => ({ id: o.id, texte: o.texte, correcte: (rc0 || []).includes(o.id) }))
      : [{ id: uid(), texte: "", correcte: false }, { id: uid(), texte: "", correcte: false }]
  );
  const [multiple, setMultiple] = useState(!!d0.multiple);
  const [vraiFauxValeur, setVraiFauxValeur] = useState(rc0.valeur != null ? rc0.valeur : true);
  const [reponsesAcceptees, setReponsesAcceptees] = useState((rc0.reponses_acceptees || []).join("\n"));
  const [paires, setPaires] = useState(
    (d0.paires && d0.paires.length) ? d0.paires.map(p => ({ id: p.id, gauche: p.gauche, droite: p.droite }))
      : [{ id: uid(), gauche: "", droite: "" }, { id: uid(), gauche: "", droite: "" }]
  );
  const [items, setItems] = useState(
    (d0.items && d0.items.length) ? d0.items.map(it => ({ id: it.id, texte: it.texte }))
      : [{ id: uid(), texte: "" }, { id: uid(), texte: "" }, { id: uid(), texte: "" }]
  );
  const [texteTrousBrut, setTexteTrousBrut] = useState(e0.texteTrousBrut || "");
  const [calculValeur, setCalculValeur] = useState(rc0.valeur != null ? String(rc0.valeur) : "");
  const [calculTolerance, setCalculTolerance] = useState(rc0.tolerance != null ? String(rc0.tolerance) : "0");
  const [formatsAcceptes, setFormatsAcceptes] = useState(d0.formats_acceptes || ".pdf,.docx,.xlsx,.jpg,.png");
  const [erreurLocale, setErreurLocale] = useState("");

  function ajouterOption() { setOptions([...options, { id: uid(), texte: "", correcte: false }]); }
  function ajouterPaire() { setPaires([...paires, { id: uid(), gauche: "", droite: "" }]); }
  function ajouterItem() { setItems([...items, { id: uid(), texte: "" }]); }
  function deplacerItem(i, sens) {
    const j = i + sens;
    if (j < 0 || j >= items.length) return;
    const a = items.slice();
    [a[i], a[j]] = [a[j], a[i]];
    setItems(a);
  }

  const correctionManuelle = TYPES_CORRECTION_MANUELLE.includes(type);

  function optionsRemplies() { return options.filter(o => o.texte.trim()); }
  function pairesRemplies() { return paires.filter(p => p.gauche.trim() && p.droite.trim()); }
  function itemsRemplis() { return items.filter(it => it.texte.trim()); }

  function construire() {
    let donnees = {}, reponse_correcte = {};
    if (type === "qcm" || type === "image" || type === "video") {
      const rem = optionsRemplies();
      donnees = { options: rem.map(o => ({ id: o.id, texte: o.texte })), multiple };
      reponse_correcte = rem.filter(o => o.correcte).map(o => o.id);
    } else if (type === "vrai_faux") {
      donnees = {};
      reponse_correcte = { valeur: vraiFauxValeur };
    } else if (type === "reponse_courte") {
      donnees = {};
      reponse_correcte = { reponses_acceptees: reponsesAcceptees.split("\n").map(s => s.trim()).filter(Boolean) };
    } else if (type === "reponse_longue") {
      donnees = {};
      reponse_correcte = {};
    } else if (type === "depot_fichier") {
      donnees = { formats_acceptes: formatsAcceptes };
      reponse_correcte = {};
    } else if (type === "association") {
      const rem = pairesRemplies();
      donnees = { paires: rem.map(p => ({ id: p.id, gauche: p.gauche, droite: p.droite })) };
      reponse_correcte = {};
      rem.forEach(p => { reponse_correcte[p.id] = p.id; });
    } else if (type === "classement") {
      const rem = itemsRemplis();
      donnees = { items: rem.map(it => ({ id: it.id, texte: it.texte })) };
      reponse_correcte = rem.map(it => it.id);
    } else if (type === "texte_trous") {
      const parsed = parseTexteTrous(texteTrousBrut);
      donnees = { texte_affiche: parsed.texte_affiche, nb_trous: parsed.nb_trous };
      reponse_correcte = parsed.correct;
    } else if (type === "calcul") {
      donnees = {};
      reponse_correcte = { valeur: parseFloat(calculValeur), tolerance: parseFloat(calculTolerance || "0") };
    }
    return {
      ordre, type, enonce, description: description || null, image_url: imageUrl || null,
      points: parseFloat(points) || 1, temps_limite_secondes: parseInt(tempsLimite, 10) || 60,
      donnees, reponse_correcte,
    };
  }

  // Renvoie un message précis expliquant ce qu'il manque, ou null si tout est prêt.
  function messageValidation() {
    if (!enonce.trim()) return "Rédigez l'énoncé de la question avant d'enregistrer.";
    if (type === "image" && !imageUrl.trim()) return "Importez une image : ce type de question en a besoin.";
    if (type === "video" && !imageUrl.trim()) return "Ajoutez le lien de la vidéo : ce type de question en a besoin.";
    if (televersementEnCours) return "Patientez : l'envoi de l'image est en cours.";
    if (type === "qcm" || type === "image" || type === "video") {
      const rem = optionsRemplies();
      if (rem.length < 2) return "Ajoutez au moins deux options non vides.";
      if (!rem.some(o => o.correcte)) return "Cochez la case devant la (ou les) bonne(s) réponse(s) — c'est ce qui permet la correction automatique.";
      return null;
    }
    if (type === "reponse_courte") return reponsesAcceptees.trim() ? null : "Indiquez au moins une réponse acceptée (c'est la bonne réponse de cette question).";
    if (type === "association") return pairesRemplies().length >= 2 ? null : "Remplissez au moins deux paires complètes (élément de gauche et de droite).";
    if (type === "classement") return itemsRemplis().length >= 2 ? null : "Remplissez au moins deux éléments à classer.";
    if (type === "texte_trous") return /\{\{[^}]+\}\}/.test(texteTrousBrut) ? null : "Encadrez au moins un mot avec {{ }} pour créer un trou et sa bonne réponse.";
    if (type === "calcul") return calculValeur !== "" ? null : "Indiquez le résultat attendu.";
    return null; // reponse_longue, depot_fichier : correction manuelle, pas de bonne réponse à saisir ici
  }

  return (
    <div className="card">
      <h3 style={{ marginBottom: 16 }}>{existant ? "Modifier la question" : "Question " + ordre}</h3>
      <div className="qtype-grid">
        {TYPES.map(t => (
          <button type="button" key={t.id} className={"qtype-opt" + (type === t.id ? " active" : "")} onClick={() => setType(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      <div className="field">
        <label>Énoncé</label>
        <textarea value={enonce} onChange={e => setEnonce(e.target.value)} placeholder="Rédigez la consigne de la question…" />
      </div>
      <div className="field">
        <label>Consigne complémentaire (facultatif — affichée sous l'énoncé)</label>
        <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="ex. Justifiez votre réponse en une phrase." />
      </div>

      {type === "video" ? (
        <div className="field">
          <label>Lien de la vidéo (YouTube, Vimeo ou fichier .mp4 direct — obligatoire pour ce type)</label>
          <input type="text" value={imageUrl} onChange={e => setImageUrl(e.target.value)} placeholder="https://www.youtube.com/watch?v=…" />
          {imageUrl && <LecteurVideo url={imageUrl} />}
        </div>
      ) : (
        <div className="field">
          <label>{type === "image" ? "Image de la question (obligatoire pour ce type — importez un fichier)" : "Image jointe (facultatif — importez un fichier)"}</label>
          <input type="file" accept="image/*" onChange={e => televerserImage(e.target.files[0])} disabled={televersementEnCours} />
          {televersementEnCours && <p style={{ fontSize: ".82rem", color: "var(--ink-faint)", marginTop: 6 }}>Envoi de l'image en cours…</p>}
          {erreurTeleversement && <div className="error-msg" style={{ marginTop: 6 }}>{erreurTeleversement}</div>}
          {imageUrl && !televersementEnCours && (
            <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 12 }}>
              <img src={imageUrl} alt="Aperçu" style={{ maxWidth: 180, maxHeight: 120, borderRadius: 4, border: "1px solid var(--line)" }} />
              <button type="button" className="btn btn-sm btn-outline" onClick={() => setImageUrl("")}>Retirer l'image</button>
            </div>

        <div className="field">
          <label>Paires à associer</label>
          {paires.map((p, i) => (
            <div className="opt-row" key={p.id}>
              <input type="text" placeholder="Élément (gauche)" value={p.gauche}
                onChange={e => setPaires(paires.map((x, xi) => xi === i ? { ...x, gauche: e.target.value } : x))} />
              <span style={{ color: "var(--ink-faint)" }}>↔</span>
              <input type="text" placeholder="Correspond à (droite)" value={p.droite}
                onChange={e => setPaires(paires.map((x, xi) => xi === i ? { ...x, droite: e.target.value } : x))} />
              {paires.length > 2 && (
                <button type="button" className="btn btn-sm btn-danger" onClick={() => setPaires(paires.filter((_, xi) => xi !== i))}>✕</button>
              )}
            </div>
          ))}
          <button type="button" className="btn btn-outline btn-sm" onClick={ajouterPaire}>+ Ajouter une paire</button>
        </div>
      )}

      {type === "classement" && (
        <div className="field">
          <label>Éléments, dans l'ordre correct (l'élève les verra mélangés)</label>
          {items.map((it, i) => (
            <div className="opt-row" key={it.id}>
              <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink-faint)", width: 18 }}>{i + 1}</span>
              <input type="text" value={it.texte}
                onChange={e => setItems(items.map((x, xi) => xi === i ? { ...x, texte: e.target.value } : x))} />
              <button type="button" className="btn btn-sm btn-outline" onClick={() => deplacerItem(i, -1)} disabled={i === 0}>↑</button>
              <button type="button" className="btn btn-sm btn-outline" onClick={() => deplacerItem(i, 1)} disabled={i === items.length - 1}>↓</button>
              {items.length > 2 && (
                <button type="button" className="btn btn-sm btn-danger" onClick={() => setItems(items.filter((_, xi) => xi !== i))}>✕</button>
              )}
            </div>
          ))}
          <button type="button" className="btn btn-outline btn-sm" onClick={ajouterItem}>+ Ajouter un élément</button>
        </div>
      )}

      {type === "texte_trous" && (
        <div className="field">
          <label>Texte — encadrez chaque trou avec {"{{ }}"}, séparez les variantes acceptées par «/»</label>
          <textarea value={texteTrousBrut} onChange={e => setTexteTrousBrut(e.target.value)}
            placeholder={"La capitale politique de la Côte d'Ivoire est {{Yamoussoukro}}, fondée sous l'impulsion de {{Félix Houphouët-Boigny/Houphouët-Boigny}}."} />
          {texteTrousBrut && <div className="info-msg">Aperçu : {parseTexteTrous(texteTrousBrut).texte_affiche}</div>}
        </div>
      )}

      {type === "calcul" && (
        <div className="row">
          <div className="field"><label>Résultat attendu</label><input type="number" step="any" value={calculValeur} onChange={e => setCalculValeur(e.target.value)} /></div>
          <div className="field"><label>Tolérance (± , facultatif)</label><input type="number" step="any" value={calculTolerance} onChange={e => setCalculTolerance(e.target.value)} /></div>
        </div>
      )}

      <div className="row">
        <div className="field"><label>Points</label><input type="number" step="any" value={points} onChange={e => setPoints(e.target.value)} /></div>
        <div className="field"><label>Chrono de la question (secondes)</label><input type="number" value={tempsLimite} onChange={e => setTempsLimite(e.target.value)} /></div>
      </div>

      {erreurLocale && <div className="error-msg">{erreurLocale}</div>}
      <div style={{ display: "flex", gap: 10 }}>
        <button type="button" className="btn btn-accent" onClick={() => {
          const msg = messageValidation();
          if (msg) { setErreurLocale(msg); return; }
          setErreurLocale("");
          onSave(construire());
        }}>
          {existant ? "Enregistrer les modifications" : "Enregistrer la question"}
        </button>
        <button type="button" className="btn btn-outline" onClick={onCancel}>Annuler</button>
      </div>
    </div>
  );
}

// ============================================================
// AFFICHAGE DE QUESTION (élève) — collecte la réponse par type
// ============================================================
function QuestionRenderer({ question, onChange, sessionId }) {
  const d = question.donnees || {};

  if (question.type === "qcm" || question.type === "image" || question.type === "video") {
    const [options] = useState(() => shuffle(d.options || []));
    const [selection, setSelection] = useState([]);
    function toggle(id) {
      let next;
      if (d.multiple) next = selection.includes(id) ? selection.filter(x => x !== id) : [...selection, id];
      else next = [id];
      setSelection(next);
      onChange(next);
    }
    return (
      <div>
        {question.type === "video"
          ? (question.image_url && <LecteurVideo url={question.image_url} />)
          : (question.image_url && <img src={question.image_url} alt="Support de la question" />)}
        {options.map(o => (
          <div key={o.id} className={"choice-row" + (selection.includes(o.id) ? " selected" : "")} onClick={() => toggle(o.id)}>
            <input type={d.multiple ? "checkbox" : "radio"} readOnly checked={selection.includes(o.id)} />
            <span>{o.texte}</span>
          </div>
        ))}
      </div>
    );
  }

  if (question.type === "vrai_faux") {
    const [val, setVal] = useState(null);
    function choisir(v) { setVal(v); onChange({ valeur: v }); }
    return (
      <div style={{ display: "flex", gap: 12 }}>
        <div className={"choice-row" + (val === true ? " selected" : "")} style={{ flex: 1, justifyContent: "center" }} onClick={() => choisir(true)}>Vrai</div>
        <div className={"choice-row" + (val === false ? " selected" : "")} style={{ flex: 1, justifyContent: "center" }} onClick={() => choisir(false)}>Faux</div>
      </div>
    );
  }

  if (question.type === "reponse_courte") {
    const [texte, setTexte] = useState("");
    return (
      <input type="text" style={{ width: "100%", padding: "11px 13px", fontSize: "1.05rem", border: "1px solid var(--line)", borderRadius: 4 }}
        placeholder="Votre réponse…" value={texte}
        onChange={e => { setTexte(e.target.value); onChange({ texte: e.target.value }); }} />
    );
  }

  if (question.type === "calcul") {
    const [val, setVal] = useState("");
    return (
      <input type="number" step="any" style={{ width: "100%", padding: "11px 13px", fontSize: "1.05rem", fontFamily: "var(--font-mono)", border: "1px solid var(--line)", borderRadius: 4 }}
        placeholder="Votre résultat…" value={val}
        onChange={e => { setVal(e.target.value); onChange({ valeur: parseFloat(e.target.value) }); }} />
    );
  }

  if (question.type === "association") {
    const paires = d.paires || [];
    const [droiteShuffle] = useState(() => shuffle(paires.map(p => ({ id: p.id, texte: p.droite }))));
    const [choix, setChoix] = useState({});
    function selectionner(gaucheId, droiteId) {
      const next = { ...choix, [gaucheId]: droiteId };
      setChoix(next);
      onChange(next);
    }
    return (
      <div>
        {paires.map(p => (
          <div className="row" key={p.id} style={{ marginBottom: 8, alignItems: "center" }}>
            <div style={{ flex: 1, padding: "9px 12px", background: "var(--paper)", borderRadius: 4 }}>{p.gauche}</div>
            <select style={{ flex: 1, padding: "9px 12px", border: "1px solid var(--line)", borderRadius: 4 }}
              value={choix[p.id] || ""} onChange={e => selectionner(p.id, e.target.value)}>
              <option value="">— choisir —</option>
              {droiteShuffle.map(dd => <option key={dd.id} value={dd.id}>{dd.texte}</option>)}
            </select>
          </div>
        ))}
      </div>
    );
  }

  if (question.type === "classement") {
    const [ordre, setOrdre] = useState(() => shuffle(d.items || []));
    function deplacer(i, sens) {
      const j = i + sens;
      if (j < 0 || j >= ordre.length) return;
      const a = ordre.slice();
      [a[i], a[j]] = [a[j], a[i]];
      setOrdre(a);
      onChange(a.map(x => x.id));
    }
    useEffect(() => { onChange(ordre.map(x => x.id)); }, []);
    return (
      <div>
        {ordre.map((it, i) => (
          <div className="dragitem" key={it.id}>
            <span>{i + 1}. {it.texte}</span>
            <span className="handles">
              <button type="button" onClick={() => deplacer(i, -1)} disabled={i === 0}>↑</button>
              <button type="button" onClick={() => deplacer(i, 1)} disabled={i === ordre.length - 1}>↓</button>
            </span>
          </div>
        ))}
      </div>
    );
  }

  if (question.type === "texte_trous") {
    const parts = (d.texte_affiche || "").split(/___(\d+)___/);
    const [reponses, setReponses] = useState({});
    function maj(cle, valeur) {
      const next = { ...reponses, [cle]: valeur };
      setReponses(next);
      onChange(next);
    }
    return (
      <p className="trou-texte">
        {parts.map((part, i) => {
          if (i % 2 === 1) {
            return <input key={i} className="blank-input" value={reponses[part] || ""} onChange={e => maj(part, e.target.value)} />;
          }
          return <span key={i}>{part}</span>;
        })}
      </p>
    );
  }

  if (question.type === "reponse_longue") {
    const [texte, setTexte] = useState("");
    return (
      <textarea style={{ width: "100%", minHeight: 180, padding: "12px 14px", fontSize: "1rem", border: "1px solid var(--line)", borderRadius: 4, fontFamily: "var(--font-body)" }}
        placeholder="Rédigez votre réponse ici…" value={texte}
        onChange={e => { setTexte(e.target.value); onChange({ texte: e.target.value }); }} />
    );
  }

  if (question.type === "depot_fichier") {
    const [nomFichier, setNomFichier] = useState("");
    const [statut, setStatut] = useState("");
    async function gererFichier(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) { setStatut("trop_volumineux"); return; }
      setStatut("envoi");
      setNomFichier(file.name);
      const chemin = (sessionId || "session") + "/" + question.id + "-" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const { error } = await sb.storage.from("depots-eleves").upload(chemin, file, { upsert: true });
      if (error) { setStatut("erreur"); return; }
      setStatut("ok");
      onChange({ chemin, nom_fichier: file.name });
    }
    return (
      <div>
        <div className="info-msg">Formats attendus : {d.formats_acceptes || "tous formats"} — 15 Mo maximum</div>
        <input type="file" onChange={gererFichier} />
        {statut === "envoi" && <p style={{ color: "var(--ink-faint)", marginTop: 8 }}>Envoi en cours…</p>}
        {statut === "ok" && <p style={{ color: "var(--success)", marginTop: 8 }}>✓ Déposé : {nomFichier}</p>}
        {statut === "erreur" && <div className="error-msg">Échec de l'envoi. Vérifiez votre connexion et réessayez.</div>}
        {statut === "trop_volumineux" && <div className="error-msg">Fichier trop volumineux (15 Mo maximum).</div>}
      </div>
    );
  }

  return <div className="info-msg">Type de question non pris en charge.</div>;
}

// ============================================================
// PASSATION D'EXAMEN (élève)
// ============================================================
function PassationExamen({ session, examen, onTermine }) {
  const [questions, setQuestions] = useState(null);
  const [sessionId, setSessionId] = useState(null);
  const [dateLimiteGlobale, setDateLimiteGlobale] = useState(null); // timestamp ms, ou null si pas de limite
  const [tempsGlobalRestant, setTempsGlobalRestant] = useState(null);
  const [index, setIndex] = useState(0);
  const [reponseCourante, setReponseCourante] = useState(null);
  const [alerte, setAlerte] = useState("");
  const [envoiEnCours, setEnvoiEnCours] = useState(false);
  const debutQuestion = useRef(Date.now());
  const finaliseRef = useRef(false);

  useEffect(() => {
    (async () => {
      const dep = await rpc("rpc_demarrer_session", { p_token: session.token, p_examen_id: examen.id });
      setSessionId(dep.session_id);
      if (dep.duree_minutes) {
        setDateLimiteGlobale(new Date(dep.debut_a).getTime() + dep.duree_minutes * 60000);
      }
      const q = await rpc("rpc_questions_examen", { p_token: session.token, p_examen_id: examen.id, p_role: "eleve" });
      setQuestions(q.questions);
    })();
  }, []);

  const niveauAntiTriche = examen.anti_triche_niveau || "avance";

  const logAntiTriche = useCallback(async (type, details) => {
    setAlerte("Action détectée et enregistrée : " + details);
    setTimeout(() => setAlerte(""), 3500);
    if (sessionId) {
      try { await rpc("rpc_log_anti_triche", { p_token: session.token, p_session_id: sessionId, p_type_evenement: type, p_details: details }); }
      catch (e) { /* silencieux */ }
    }
  }, [sessionId]);

  useAntiTriche(!!sessionId, niveauAntiTriche, logAntiTriche);

  useEffect(() => { debutQuestion.current = Date.now(); }, [index]);

  // Chrono global de la composition (indépendant du chrono par question)
  useEffect(() => {
    if (!dateLimiteGlobale) return;
    const iv = setInterval(() => {
      const restant = Math.max(0, Math.round((dateLimiteGlobale - Date.now()) / 1000));
      setTempsGlobalRestant(restant);
      if (restant <= 0) {
        clearInterval(iv);
        finaliserExpire();
      }
    }, 1000);
    return () => clearInterval(iv);
  }, [dateLimiteGlobale]);

  async function finaliserExpire() {
    if (finaliseRef.current) return;
    finaliseRef.current = true;
    try {
      const res = await rpc("rpc_terminer_session", { p_token: session.token, p_session_id: sessionId, p_statut: "expiree" });
      onTermine(res);
    } catch (e) {
      onTermine({ note_sur_20: null, score_total: 0, score_max: 0 });
    }
  }

  async function finaliser() {
    if (finaliseRef.current) return;
    finaliseRef.current = true;
    const res = await rpc("rpc_terminer_session", { p_token: session.token, p_session_id: sessionId });
    onTermine(res);
  }

  async function validerEtSuivant() {
    if (!questions || finaliseRef.current) return;
    setEnvoiEnCours(true);
    const q = questions[index];
    const temps = Math.round((Date.now() - debutQuestion.current) / 1000);
    try {
      if (reponseCourante != null) {
        const res = await rpc("rpc_soumettre_reponse", {
          p_token: session.token, p_session_id: sessionId, p_question_id: q.id,
          p_reponse: reponseCourante, p_temps_passe: temps,
        });
      }
    } catch (e) {
      if (String(e.message).includes("temps_ecoule")) {
        finaliseRef.current = true;
        onTermine(e.data || { note_sur_20: null, score_total: 0, score_max: 0 });
        return;
      }
      /* autre erreur réseau ponctuelle : on continue quand même */
    }
    setReponseCourante(null);
    setEnvoiEnCours(false);
    if (index + 1 < questions.length) setIndex(index + 1);
    else finaliser();
  }

  if (!questions) {
    return <div className="exam-shell"><div className="exam-body"><div style={{ color: "#fff" }}>Préparation de la composition…</div></div></div>;
  }

  const q = questions[index];

  return (
    <div className="exam-shell">
      <div className="exam-header">
        <span>{examen.titre} — {session.nom} {session.prenom} ({session.matricule})</span>
        <span>Question {index + 1} / {questions.length}</span>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          {tempsGlobalRestant != null && (
            <span className={"chrono" + (tempsGlobalRestant <= 60 ? " low" : "")} title="Temps total restant pour la composition">
              Total {fmtChrono(tempsGlobalRestant)}
            </span>
          )}
          <Timer seconds={q.temps_limite_secondes || 60} questionKey={q.id} onExpire={validerEtSuivant} />
        </div>
      </div>
      {alerte && <div className="warning-banner">⚠ {alerte}</div>}
      <div className="exam-body">
        <div className="question-card">
          {q.section_titre && (
            <div style={{ fontFamily: "var(--font-mono)", fontSize: ".78rem", letterSpacing: ".03em", color: "var(--accent-deep)", marginBottom: 8, textTransform: "uppercase" }}>
              {q.section_titre}
            </div>
          )}
          {q.section_description && <p style={{ fontSize: ".85rem", color: "var(--ink-faint)", marginTop: -6, marginBottom: 14 }}>{q.section_description}</p>}
          <div className="qnum">Question {index + 1} sur {questions.length} · {q.points} point{q.points > 1 ? "s" : ""} · {typeLabel(q.type)}</div>
          {q.type !== "texte_trous" && <div className="enonce">{q.enonce}</div>}
          <QuestionRenderer key={q.id} question={q} onChange={setReponseCourante} sessionId={sessionId} />
        </div>
      </div>
      <div className="exam-footer">
        <button className="btn btn-accent" disabled={envoiEnCours} onClick={validerEtSuivant}>
          {index + 1 < questions.length ? "Question suivante" : "Terminer la composition"}
        </button>
      </div>
    </div>
  );
}

function EditeurExamen({ session, examenId, onRetour, labelRetour, onDuplique }) {
  const [examen, setExamen] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [classesDisponibles, setClassesDisponibles] = useState([]);
  const [edition, setEdition] = useState(null); // {mode:'question'|'section', existant?, }
  const [formKey, setFormKey] = useState(0);
  const [confirmation, setConfirmation] = useState("");
  const [erreur, setErreur] = useState("");
  const [parametresOuverts, setParametresOuverts] = useState(false);
  const [param, setParam] = useState(null);
  const [publicationOuverte, setPublicationOuverte] = useState(false);
  const [pub, setPub] = useState({ date_ouverture: "", date_fermeture: "" });
  const [actionEnCours, setActionEnCours] = useState(false);
  const estAdmin = !!session.est_admin;

  async function recharger() {
    try {
      const d = await rpc("rpc_obtenir_examen", { p_token: session.token, p_examen_id: examenId });
      const ex = d.examen;
      setExamen(ex);
      if (ex && !param) {
        setParam({
          titre: ex.titre, description: ex.description || "",
          classes_cibles: ex.classes_cibles || null, toutes_classes: !ex.classes_cibles,
          duree_minutes: ex.duree_minutes || "", tentatives_max: ex.tentatives_max || 1,
          anti_triche: ex.anti_triche_niveau || "avance",
        });
      }
      const q = await rpc("rpc_questions_examen", { p_token: session.token, p_examen_id: examenId, p_role: "enseignant" });
      setQuestions(q.questions);
      setErreur("");
    } catch (e) { setErreur(e.message); }
  }
  useEffect(() => { recharger(); }, [examenId]);
  useEffect(() => {
    rpc("rpc_liste_classes", { p_token: session.token }).then(d => setClassesDisponibles(d.classes)).catch(() => {});
  }, []);

  const nbQuestionsReelles = questions.filter(q => q.type !== "section").length;
  const limiteAtteinte = nbQuestionsReelles >= MAX_QUESTIONS_PAR_EXAMEN;

  async function enregistrerQuestion(q) {
    try {
      const modeAjoutQuestion = edition && edition.mode === "question" && !edition.existant;
      if (edition && edition.existant) {
        await rpc("rpc_modifier_question", {
          p_token: session.token, p_question_id: edition.existant.id,
          p_enonce: q.enonce, p_description: q.description, p_image_url: q.image_url,
          p_points: q.points, p_temps_limite: q.temps_limite_secondes,
          p_donnees: q.donnees, p_reponse_correcte: q.reponse_correcte,
        });
      } else {
        await rpc("rpc_ajouter_question", {
          p_token: session.token, p_examen_id: examenId, p_ordre: q.ordre, p_type: q.type,
          p_enonce: q.enonce, p_description: q.description, p_image_url: q.image_url, p_points: q.points,
          p_temps_limite: q.temps_limite_secondes, p_donnees: q.donnees, p_reponse_correcte: q.reponse_correcte,
        });
      }
      setErreur("");
      if (modeAjoutQuestion) {
        if (nbQuestionsReelles + 1 >= MAX_QUESTIONS_PAR_EXAMEN) {
          setEdition(null);
          setConfirmation("Question " + q.ordre + " enregistrée ✓ — limite de " + MAX_QUESTIONS_PAR_EXAMEN + " questions atteinte.");
        } else {
          // on reste en mode "ajout" avec un formulaire vierge, prêt pour la question suivante
          setFormKey(k => k + 1);
          setConfirmation("Question " + q.ordre + " enregistrée ✓ — formulaire prêt pour la suivante.");
        }
        setTimeout(() => setConfirmation(""), 3000);
      } else {
        setEdition(null);
      }
      recharger();
    } catch (e) { setErreur(e.message); }
  }

  async function supprimerQuestion(id) {
    try {
      await rpc("rpc_supprimer_question", { p_token: session.token, p_question_id: id });
      setErreur("");
      recharger();
    } catch (e) { setErreur(e.message); }
  }

  async function deplacer(i, sens) {
    const j = i + sens;
    if (j < 0 || j >= questions.length) return;
    const a = questions.slice();
    [a[i], a[j]] = [a[j], a[i]];
    setQuestions(a);
    try {
      await rpc("rpc_reordonner_examen", { p_token: session.token, p_examen_id: examenId, p_ordre_ids: a.map(x => x.id) });
      setErreur("");
    } catch (e) { setErreur(e.message); recharger(); }
  }

  async function enregistrerParametres() {
    try {
      await rpc("rpc_modifier_examen", {
        p_token: session.token, p_examen_id: examenId, p_titre: param.titre, p_description: param.description,
        p_classes_cibles: param.toutes_classes ? null : param.classes_cibles,
        p_duree_minutes: param.duree_minutes ? parseInt(param.duree_minutes, 10) : null,
        p_tentatives_max: parseInt(param.tentatives_max, 10) || 1, p_anti_triche: param.anti_triche,
      });
      setErreur("");
      setParametresOuverts(false);
      recharger();
    } catch (e) { setErreur(e.message); }
  }

  function toggleClasse(c) {
    const actuelles = param.classes_cibles || [];
    const next = actuelles.includes(c) ? actuelles.filter(x => x !== c) : [...actuelles, c];
    setParam({ ...param, classes_cibles: next });
  }

  function ouvrirPublication() {
    const maintenant = new Date(Date.now() - Date.now() % 60000).toISOString().slice(0, 16);
    const dans30j = new Date(Date.now() + 30 * 24 * 3600 * 1000).toISOString().slice(0, 16);
    setPub({ date_ouverture: maintenant, date_fermeture: dans30j });
    setPublicationOuverte(true);
  }
  async function confirmerPublication() {
    try {
      await rpc("rpc_publier_examen", {
        p_token: session.token, p_examen_id: examenId,
        p_date_ouverture: new Date(pub.date_ouverture).toISOString(),
        p_date_fermeture: new Date(pub.date_fermeture).toISOString(),
      });
      setPublicationOuverte(false);
      recharger();
    } catch (e) { setErreur(e.message); }
  }
  async function cloturer() {
    try {
      await rpc("rpc_cloturer_examen", { p_token: session.token, p_examen_id: examenId });
      setErreur("");
      recharger();
    } catch (e) { setErreur(e.message); }
  }

  async function dupliquer() {
    setActionEnCours(true);
    try {
      const d = await rpc("rpc_dupliquer_examen", { p_token: session.token, p_examen_id: examenId });
      setErreur("");
      if (onDuplique) onDuplique(d.id);
    } catch (e) { setErreur(e.message); } finally { setActionEnCours(false); }
  }

  async function repasserBrouillon() {
    if (!window.confirm("Repasser ce devoir en brouillon ? Il redeviendra invisible pour les élèves jusqu'à une nouvelle publication.")) return;
    setActionEnCours(true);
    try {
      await rpc("rpc_repasser_brouillon", { p_token: session.token, p_examen_id: examenId });
      setErreur("");
      recharger();
    } catch (e) { setErreur(e.message); } finally { setActionEnCours(false); }
  }

  if (!examen || !param) return <div className="container">Chargement…</div>;
  const modifiable = examen.statut === "brouillon";

  return (
    <div className="container">
      <button className="linkbtn" style={{ marginBottom: 16 }} onClick={onRetour}>{labelRetour || "← Retour à mes examens"}</button>
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <h2>{examen.titre}</h2>
            <p style={{ color: "var(--ink-soft)", marginBottom: 6 }}>{examen.description}</p>
            <span className={"badge badge-" + examen.statut}>{examen.statut}</span>
            <span style={{ marginLeft: 10, fontSize: ".82rem", color: "var(--ink-faint)" }}>
              {nbQuestionsReelles} / {MAX_QUESTIONS_PAR_EXAMEN} questions · {examen.tentatives_max} tentative(s) · anti-triche {examen.anti_triche_niveau}
            </span>
            <div style={{ fontSize: ".82rem", color: "var(--ink-faint)", marginTop: 4 }}>
              Classes : {examen.classes_cibles && examen.classes_cibles.length ? examen.classes_cibles.join(", ") : "toutes les classes"}
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "flex-end" }}>
            {modifiable && <button className="btn btn-outline" onClick={() => setParametresOuverts(!parametresOuverts)}>Paramètres</button>}
            {modifiable && <button className="btn btn-accent" disabled={nbQuestionsReelles === 0} onClick={ouvrirPublication}>Publier</button>}
            {examen.statut === "publie" && <button className="btn btn-outline" onClick={cloturer}>Clôturer</button>}
            {examen.statut === "publie" && <button className="btn btn-outline" disabled={actionEnCours} onClick={repasserBrouillon} title="Uniquement possible si personne n'a encore composé">Repasser en brouillon</button>}
            {(examen.statut === "publie" || examen.statut === "clos") && (
              <button className="btn btn-outline" disabled={actionEnCours} onClick={dupliquer}>Dupliquer pour réutiliser</button>
            )}
          </div>
        </div>
      </div>

      {parametresOuverts && modifiable && (
        <div className="card">
          <h3>Paramètres de l'évaluation</h3>
          <div className="field"><label>Titre</label><input type="text" value={param.titre} onChange={e => setParam({ ...param, titre: e.target.value })} /></div>
          <div className="field"><label>Description</label><textarea value={param.description} onChange={e => setParam({ ...param, description: e.target.value })} /></div>
          <div className="field">
            <label>Classes concernées</label>
            <div style={{ marginBottom: 8 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 400 }}>
                <input type="checkbox" checked={param.toutes_classes} onChange={e => setParam({ ...param, toutes_classes: e.target.checked })} />
                Toutes les classes
              </label>
            </div>
            {!param.toutes_classes && (
              <div className="qtype-grid">
                {classesDisponibles.map(c => (
                  <button type="button" key={c} className={"qtype-opt" + ((param.classes_cibles || []).includes(c) ? " active" : "")} onClick={() => toggleClasse(c)}>
                    {c}
                  </button>
                ))}
                {classesDisponibles.length === 0 && <span style={{ fontSize: ".82rem", color: "var(--ink-faint)" }}>Aucune classe trouvée dans la liste des élèves autorisés.</span>}
              </div>
            )}
          </div>
          <div className="row">
            <div className="field"><label>Durée de composition en minutes (facultatif — décompte dès le lancement par l'élève)</label><input type="number" value={param.duree_minutes} onChange={e => setParam({ ...param, duree_minutes: e.target.value })} /></div>
            <div className="field"><label>Tentatives autorisées</label><input type="number" min="1" value={param.tentatives_max} onChange={e => setParam({ ...param, tentatives_max: e.target.value })} /></div>
          </div>
          <div className="field">
            <label>Niveau anti-triche</label>
            <select value={param.anti_triche} onChange={e => setParam({ ...param, anti_triche: e.target.value })}>
              <option value="basique">Basique</option>
              <option value="avance">Avancé</option>
            </select>
          </div>
          <button className="btn btn-accent" onClick={enregistrerParametres}>Enregistrer les paramètres</button>
        </div>
      )}

      {publicationOuverte && (
        <div className="card">
          <h3>Programmer la publication</h3>
          <div className="row">
            <div className="field"><label>Date et heure d'ouverture</label><input type="datetime-local" value={pub.date_ouverture} onChange={e => setPub({ ...pub, date_ouverture: e.target.value })} /></div>
            <div className="field"><label>Date et heure de fermeture</label><input type="datetime-local" value={pub.date_fermeture} onChange={e => setPub({ ...pub, date_fermeture: e.target.value })} /></div>
          </div>
          <p style={{ fontSize: ".82rem", color: "var(--ink-faint)" }}>Le devoir sera automatiquement visible par les classes désignées à l'heure d'ouverture, puis inaccessible après la fermeture — vous n'avez rien d'autre à faire à ce moment-là.</p>
          <div style={{ display: "flex", gap: 10 }}>
            <button className="btn btn-accent" onClick={confirmerPublication}>Confirmer la publication</button>
            <button className="btn btn-outline" onClick={() => setPublicationOuverte(false)}>Annuler</button>
          </div>
        </div>
      )}

      <h3 style={{ margin: "24px 0 12px" }}>Contenu du devoir</h3>
      {erreur && <div className="error-msg">{erreur}</div>}
      {confirmation && <div className="info-msg" style={{ background: "var(--success-soft)", color: "var(--success)" }}>{confirmation}</div>}

      {questions.map((q, i) => (
        q.type === "section" ? (
          <div key={q.id} style={{ margin: "18px 0 6px", padding: "10px 14px", background: "var(--ink)", color: "#fff", borderRadius: 4, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <strong>{q.enonce}</strong>
              {q.description && <div style={{ fontSize: ".8rem", opacity: .8 }}>{q.description}</div>}
              {q.points > 0 && <div style={{ fontSize: ".78rem", opacity: .75, fontFamily: "var(--font-mono)" }}>Barème de l'exercice : {q.points} pt</div>}
            </div>
            {modifiable && (
              <div style={{ display: "flex", gap: 6 }}>
                <button className="btn btn-sm btn-outline" style={{ color: "#fff", borderColor: "rgba(255,255,255,.4)" }} onClick={() => deplacer(i, -1)} disabled={i === 0}>↑</button>
                <button className="btn btn-sm btn-outline" style={{ color: "#fff", borderColor: "rgba(255,255,255,.4)" }} onClick={() => deplacer(i, 1)} disabled={i === questions.length - 1}>↓</button>
                <button className="btn btn-sm btn-outline" style={{ color: "#fff", borderColor: "rgba(255,255,255,.4)" }} onClick={() => setEdition({ mode: "section", existant: q })}>Modifier</button>
                <button className="btn btn-sm btn-danger" onClick={() => supprimerQuestion(q.id)}>Supprimer</button>
              </div>
            )}
          </div>
        ) : (
          <div className="question-item" key={q.id}>
            <div className="meta">#{i + 1} · {typeLabel(q.type)} · {q.points} pt · {q.temps_limite_secondes}s{TYPES_CORRECTION_MANUELLE.includes(q.type) ? " · correction manuelle" : ""}</div>
            <div>{q.enonce || "(texte à trous)"}</div>
            {modifiable && (
              <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                <button className="btn btn-sm btn-outline" onClick={() => deplacer(i, -1)} disabled={i === 0}>↑</button>
                <button className="btn btn-sm btn-outline" onClick={() => deplacer(i, 1)} disabled={i === questions.length - 1}>↓</button>
                <button className="btn btn-sm btn-outline" onClick={() => setEdition({ mode: "question", existant: q })}>Modifier</button>
                <button className="btn btn-sm btn-danger" onClick={() => supprimerQuestion(q.id)}>Supprimer</button>
              </div>
            )}
          </div>
        )
      ))}

      {edition && edition.mode === "question" && (
        <div>
          <QuestionEditor key={edition.existant ? edition.existant.id : "nouvelle-" + formKey}
            ordre={questions.length + 1} existant={edition.existant}
            onCancel={() => setEdition(null)} onSave={enregistrerQuestion} />
          {!edition.existant && (
            <button className="btn btn-outline btn-sm" style={{ marginTop: -8, marginBottom: 16 }} onClick={() => setEdition(null)}>
              Terminer la saisie de questions
            </button>
          )}
        </div>
      )}
      {edition && edition.mode === "section" && (
        <SectionEditor ordre={questions.length + 1} existant={edition.existant}
          onCancel={() => setEdition(null)} onSave={enregistrerQuestion} />
      )}

      {!edition && modifiable && (
        <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
          <button className="btn btn-outline" disabled={limiteAtteinte} onClick={() => setEdition({ mode: "question", existant: null })}>
            {limiteAtteinte ? "Limite de " + MAX_QUESTIONS_PAR_EXAMEN + " questions atteinte" : "+ Ajouter une question"}
          </button>
          <button className="btn btn-outline" onClick={() => setEdition({ mode: "section", existant: null })}>+ Ajouter une barre de titre</button>
        </div>
      )}
    </div>
  );
}

function DetailSession({ session, sessionId, onRetour }) {
  const [reponses, setReponses] = useState(null);
  const [liens, setLiens] = useState({});
  const [erreur, setErreur] = useState("");

  async function recharger() {
    try {
      const d = await rpc("rpc_detail_session", { p_token: session.token, p_session_id: sessionId });
      setReponses(d.reponses);
      setErreur("");
    } catch (e) { setErreur(e.message); }
  }
  useEffect(() => { recharger(); }, [sessionId]);

  async function obtenirLien(chemin) {
    const { data, error } = await sb.storage.from("depots-eleves").createSignedUrl(chemin, 3600);
    if (!error && data) setLiens(l => ({ ...l, [chemin]: data.signedUrl }));
    else setErreur("Impossible de générer le lien de téléchargement.");
  }

  async function noter(questionId, points) {
    try {
      await rpc("rpc_noter_manuellement", { p_token: session.token, p_session_id: sessionId, p_question_id: questionId, p_points: parseFloat(points) || 0 });
      setErreur("");
      recharger();
    } catch (e) { setErreur(e.message); }
  }

  return (
    <div className="container">
      <button className="linkbtn" style={{ marginBottom: 16 }} onClick={onRetour}>← Retour aux résultats</button>
      <h2>Détail de la composition</h2>
      {erreur && <div className="error-msg">{erreur}</div>}
      {!reponses ? <p>Chargement…</p> : reponses.map(r => (
        <div className="question-item" key={r.question_id}>
          <div className="meta">{typeLabel(r.type)} · {r.points} pt{TYPES_CORRECTION_MANUELLE.includes(r.type) ? " · correction manuelle" : ""}</div>
          <div style={{ marginBottom: 8 }}>{r.question}</div>

          {r.type === "reponse_longue" && (
            <div style={{ background: "var(--paper)", padding: "10px 12px", borderRadius: 4, marginBottom: 8, whiteSpace: "pre-wrap" }}>
              {(r.reponse_donnee && r.reponse_donnee.texte) || <em style={{ color: "var(--ink-faint)" }}>Aucune réponse rédigée</em>}
            </div>
          )}

          {r.type === "depot_fichier" && (
            <div style={{ marginBottom: 8 }}>
              {r.reponse_donnee && r.reponse_donnee.chemin ? (
                liens[r.reponse_donnee.chemin] ? (
                  <a href={liens[r.reponse_donnee.chemin]} target="_blank" rel="noreferrer">Télécharger « {r.reponse_donnee.nom_fichier} »</a>
                ) : (
                  <button className="btn btn-sm btn-outline" onClick={() => obtenirLien(r.reponse_donnee.chemin)}>Générer le lien de téléchargement</button>
                )
              ) : <em style={{ color: "var(--ink-faint)" }}>Aucun fichier déposé</em>}
            </div>
          )}

          {r.type !== "reponse_longue" && r.type !== "depot_fichier" && (
            <div style={{ fontSize: ".85rem", color: r.est_correcte ? "var(--success)" : "var(--accent-deep)", marginBottom: 8 }}>
              {r.est_correcte == null ? "Sans réponse" : r.est_correcte ? "✓ Correct" : "✗ Incorrect"} · {r.points_obtenus} / {r.points} pt
            </div>
          )}

          {TYPES_CORRECTION_MANUELLE.includes(r.type) && (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <label style={{ fontSize: ".82rem", margin: 0 }}>Points attribués :</label>
              <input type="number" step="any" defaultValue={r.points_obtenus || 0} style={{ width: 80, padding: "5px 8px" }}
                onBlur={e => noter(r.question_id, e.target.value)} />
              <span style={{ fontSize: ".78rem", color: "var(--ink-faint)" }}>/ {r.points}{r.corrige_manuellement ? " · déjà noté" : " · en attente"}</span>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function ResultatsExamen({ session, examen, onRetour }) {
  const [resultats, setResultats] = useState(null);
  const [detailId, setDetailId] = useState(null);
  useEffect(() => {
    rpc("rpc_resultats_examen", { p_token: session.token, p_examen_id: examen.id }).then(d => setResultats(d.resultats));
  }, [examen.id]);

  if (detailId) return <DetailSession session={session} sessionId={detailId} onRetour={() => setDetailId(null)} />;

  function exporterExcel() {
    const lignes = resultats.map(r => ({
      Matricule: r.eleve_matricule, Nom: r.eleve_nom, Prénom: r.eleve_prenom,
      Tentative: r.tentative_numero, Statut: r.statut,
      "Note /20": r.note_sur_20, "Points": r.score_total + " / " + r.score_max,
      "Alertes anti-triche": r.nb_alertes_triche,
    }));
    const ws = XLSX.utils.json_to_sheet(lignes);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Résultats");
    XLSX.writeFile(wb, "resultats_" + examen.titre.replace(/[^a-z0-9]+/gi, "_") + ".xlsx");
  }

  return (
    <div className="container-wide">
      <button className="linkbtn" style={{ marginBottom: 16 }} onClick={onRetour}>← Retour à mes examens</button>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h2>Résultats — {examen.titre}</h2>
        {resultats && resultats.length > 0 && <button className="btn btn-outline" onClick={exporterExcel}>Exporter en Excel</button>}
      </div>
      {!resultats ? <p>Chargement…</p> : resultats.length === 0 ? <p className="info-msg">Aucune composition enregistrée pour l'instant.</p> : (
        <table className="results">
          <thead><tr><th>Matricule</th><th>Élève</th><th>Tentative</th><th>Statut</th><th>Note /20</th><th>Alertes</th><th>Durée</th><th></th></tr></thead>
          <tbody>
            {resultats.map(r => (
              <tr key={r.session_id}>
                <td style={{ fontFamily: "var(--font-mono)" }}>{r.eleve_matricule}</td>
                <td>{r.eleve_nom} {r.eleve_prenom}</td>
                <td>{r.tentative_numero}</td>
                <td>{r.statut}</td>
                <td><span className={"note-badge " + (r.note_sur_20 >= 10 ? "note-ok" : "note-bas")}>{r.note_sur_20 != null ? r.note_sur_20 : "—"}</span></td>
                <td>{r.nb_alertes_triche || 0}</td>
                <td>{r.fin_a ? Math.round((new Date(r.fin_a) - new Date(r.debut_a)) / 60000) + " min" : "en cours"}</td>
                <td><button className="btn btn-sm btn-outline" onClick={() => setDetailId(r.session_id)}>Détail / Corriger</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function EspaceEnseignant({ session, onDeconnexion }) {
  const [examens, setExamens] = useState(null);
  const [vue, setVue] = useState({ ecran: "liste" });
  const [nouveau, setNouveau] = useState({ titre: "", description: "" });
  const [erreurCreation, setErreurCreation] = useState("");
  const [creationEnCours, setCreationEnCours] = useState(false);
  const [erreurListe, setErreurListe] = useState("");

  async function recharger() {
    try {
      const d = await rpc("rpc_mes_examens", { p_token: session.token });
      setExamens(d.examens);
      setErreurListe("");
    } catch (e) { setErreurListe(e.message); }
  }
  useEffect(() => { recharger(); }, []);

  async function creerExamen(e) {
    e.preventDefault();
    setErreurCreation("");
    setCreationEnCours(true);
    try {
      const d = await rpc("rpc_creer_examen", {
        p_token: session.token, p_titre: nouveau.titre, p_description: nouveau.description,
        p_classes_cibles: null, p_duree_minutes: null, p_tentatives_max: 1, p_anti_triche: "avance",
      });
      setNouveau({ titre: "", description: "" });
      await recharger();
      setVue({ ecran: "editeur", examenId: d.id });
    } catch (err) {
      setErreurCreation(err.message.includes("fetch") ? "Connexion au serveur impossible. Vérifiez votre connexion internet." : err.message);
    } finally {
      setCreationEnCours(false);
    }
  }

  async function dupliquerDepuisListe(ex) {
    try {
      const d = await rpc("rpc_dupliquer_examen", { p_token: session.token, p_examen_id: ex.id });
      await recharger();
      setVue({ ecran: "editeur", examenId: d.id });
    } catch (e) { setErreurListe(e.message); }
  }

  if (vue.ecran === "admin") return (
    <EspaceAdmin session={session} onDeconnexion={onDeconnexion} onRetour={() => setVue({ ecran: "liste" })} />
  );
  if (vue.ecran === "editeur") return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <EditeurExamen session={session} examenId={vue.examenId} onRetour={() => { setVue({ ecran: "liste" }); recharger(); }}
        onDuplique={nouvelId => { recharger(); setVue({ ecran: "editeur", examenId: nouvelId }); }} />
    </>
  );
  if (vue.ecran === "resultats") return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <ResultatsExamen session={session} examen={vue.examen} onRetour={() => setVue({ ecran: "liste" })} />
    </>
  );

  return (
    <>
      <TopBar session={session} onDeconnexion={onDeconnexion} />
      <div className="container">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
          <h2 style={{ marginBottom: 0 }}>Mes examens</h2>
          {session.est_admin && (
            <button className="btn btn-outline" onClick={() => setVue({ ecran: "admin" })}>
              🛡️ Espace administrateur
            </button>
          )}
        </div>
        <div className="card">
          <h3>Créer un nouvel examen</h3>
          <p style={{ fontSize: ".85rem", color: "var(--ink-faint)" }}>Les classes concernées, la programmation et le niveau anti-triche se règlent juste après, dans les paramètres de l'examen.</p>
          {erreurCreation && <div className="error-msg">{erreurCreation}</div>}
          <form onSubmit={creerExamen}>
            <div className="field"><label>Titre</label><input type="text" required value={nouveau.titre} onChange={e => setNouveau({ ...nouveau, titre: e.target.value })} /></div>
            <div className="field"><label>Description</label><textarea value={nouveau.description} onChange={e => setNouveau({ ...nouveau, description: e.target.value })} /></div>
            <button className="btn btn-accent" disabled={creationEnCours}>{creationEnCours ? "Création en cours…" : "Créer et poursuivre"}</button>
          </form>
        </div>

        {erreurListe && <div className="error-msg">{erreurListe} <button className="linkbtn" onClick={recharger}>Réessayer</button></div>}
        {!examens ? (erreurListe ? null : <p>Chargement…</p>) : examens.length === 0 ? <p className="info-msg">Aucun examen créé pour l'instant.</p> : examens.map(ex => (
          <div className="card" key={ex.id}>
            <div className="list-row" style={{ padding: 0, border: "none" }}>
              <div>
                <h3 style={{ marginBottom: 4 }}>{ex.titre}</h3>
                <span className={"badge badge-" + ex.statut}>{ex.statut}</span>
                <span style={{ marginLeft: 8, fontSize: ".8rem", color: "var(--ink-faint)" }}>{ex.classes_cibles && ex.classes_cibles.length ? ex.classes_cibles.join(", ") : "toutes classes"}</span>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "flex-end" }}>
                <button className="btn btn-sm btn-outline" onClick={() => setVue({ ecran: "editeur", examenId: ex.id })}>Questions</button>
                <button className="btn btn-sm btn-outline" onClick={() => setVue({ ecran: "resultats", examen: ex })}>Résultats</button>
                {(ex.statut === "publie" || ex.statut === "clos") && (
                  <button className="btn btn-sm btn-outline" onClick={() => dupliquerDepuisListe(ex)}>Dupliquer</button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}
